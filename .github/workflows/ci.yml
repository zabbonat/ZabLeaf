name: Build check (Windows, macOS, Linux)

# The release workflow only runs on a tag, which means a break on macOS or Linux
# would not surface until release day. This builds all three on every push, so
# platform-specific mistakes fail here instead.
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-22.04

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libsoup2.4-dev build-essential curl wget libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev squashfs-tools patchelf

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.platform }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ matrix.platform }}-cargo-

      - name: install app dependencies
        run: npm install

      - name: typecheck the frontend
        run: npx tsc --noEmit

      # Catches platform-specific mistakes in main.rs. Cross-compiling these
      # from Windows is not possible without a C toolchain for each target, so
      # this job is the only place they get compiled at all.
      - name: check Rust
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: run Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: build the installer
        run: npm run tauri build

      # tauri.conf.json asks for exactly one bundle per platform. If a target
      # silently produces nothing, this is where it shows up.
      - name: confirm an installer was produced
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          produced=(
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
          )
          if [ ${#produced[@]} -eq 0 ]; then
            echo "No installer produced on ${{ matrix.platform }}." >&2
            find src-tauri/target/release/bundle -type f 2>/dev/null || echo "(no bundle directory at all)"
            exit 1
          fi
          printf 'produced: %s\n' "${produced[@]}"

      - name: upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: zabbleaf-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
