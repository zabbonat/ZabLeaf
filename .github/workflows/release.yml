name: Release Desktop App (Windows, macOS, Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-22.04

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libsoup2.4-dev build-essential curl wget libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev squashfs-tools patchelf

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install app dependencies
        run: npm install

      # No tagName here on purpose: this only builds, so the artifacts can be
      # renamed before they are published.
      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # tauri.conf.json builds exactly one installer per platform
      # (nsis -> .exe, dmg -> macOS, appimage -> Linux). Tauri names them with a
      # version and an architecture; rename to something a person can pick out
      # of a release page at a glance.
      - name: collect the installer under a platform name
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release

          for f in src-tauri/target/release/bundle/nsis/*.exe; do
            cp "$f" "release/ZabbLeaf_windows_installer.exe"
          done
          for f in src-tauri/target/release/bundle/dmg/*.dmg; do
            cp "$f" "release/ZabbLeaf_mac_installer.dmg"
          done
          for f in src-tauri/target/release/bundle/appimage/*.AppImage; do
            cp "$f" "release/ZabbLeaf_linux_installer.AppImage"
          done

          if [ -z "$(ls -A release)" ]; then
            echo "No installer was produced — check the bundle targets in tauri.conf.json." >&2
            exit 1
          fi
          ls -lh release

      # Keeps manual runs (workflow_dispatch) useful, since those do not publish.
      - name: upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zabbleaf-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

      - name: publish to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          name: ZabbLeaf ${{ github.ref_name }}
          draft: false
          prerelease: false
          # Appends the commits since the previous tag, so each release says
          # what changed without anyone writing notes by hand.
          generate_release_notes: true
          body: |
            One installer per platform — download the one for your system:

            | System | File |
            | --- | --- |
            | Windows | `ZabbLeaf_windows_installer.exe` |
            | macOS | `ZabbLeaf_mac_installer.dmg` |
            | Linux | `ZabbLeaf_linux_installer.AppImage` |

            No Node.js or developer tools required.

            **LaTeX is optional.** ZabbLeaf edits, syncs with Overleaf and shows a text preview without anything else installed. To compile real PDFs offline you also need a TeX engine (~142 MB) — the app offers to install one the first time you open it, and you can decline.
