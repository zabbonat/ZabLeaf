[package]
name = "zabbleaf"
version = "2.1.0"
description = "ZabbLeaf Desktop IDE by Diletta Abbonato (Zabbonat)"
authors = ["Diletta Abbonato (Zabbonat)"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "dialog-all", "fs-all", "path-all", "http-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
